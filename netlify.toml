[build]
  command = "npm run build"
  publish = "dist"          # only the Vite build is published — content/, HANDOFF.md, assets/ sources are not
  functions = "netlify/functions"

[dev]
  command = "npx vite build && npx vite preview --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

# unmatched /api/* (wrong method or unknown path) → JSON 404, never the SPA shell.
# Not forced: function routes (config.path) must win over this rule.
[[redirects]]
  from = "/api/*"
  to = "/api-not-found.json"
  status = 404

[[redirects]]
  from = "/slides"
  to = "/slides/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Page CSPs are set per page with <meta http-equiv> (strict for the SPA in index.html, viewer-specific in /slides/),
# because two CSP headers would be intersected and break the provided slide viewer. Only the parts that a <meta>
# cannot express are sent as a header for every path.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/slides/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/slides/"
