[build]
  command = "npm run build"
  publish = "dist"          # only the Vite build is published — content/, HANDOFF.md, assets/ sources are not
  functions = "netlify/functions"

[dev]
  command = "npx vite build && npx vite preview --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

# unmatched /api/* (wrong method or unknown path) → JSON 404, never the SPA shell.
# Not forced: function routes (config.path) must win over this rule.
[[redirects]]
  from = "/api/*"
  to = "/api-not-found.json"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
