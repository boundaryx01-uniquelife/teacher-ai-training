<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>VID-01</title>
<style>
@font-face{font-family:"NK";font-weight:400;src:url("FONTDIR/NotoSansKR-400.ttf")}
@font-face{font-family:"NK";font-weight:700;src:url("FONTDIR/NotoSansKR-700.ttf")}
@font-face{font-family:"NK";font-weight:900;src:url("FONTDIR/NotoSansKR-900.ttf")}
@font-face{font-family:"JB";src:url("FONTDIR/JetBrainsMono-400.ttf")}
html,body{margin:0;background:#F7F5EF}
#stage{width:1664px;height:260px;position:relative;overflow:hidden;background:#F7F5EF;font-family:NK,sans-serif}
svg{display:block}
.lbl{font:700 22px NK;fill:#14213D}
.sub{font:400 17px NK;fill:#4A5568}
.mono{font:400 16px JB,monospace;fill:#14213D;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.monoW{font:400 14px JB,monospace;fill:#F7F5EF;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
</style></head><body>
<div id="stage">
<svg id="svg" width="1664" height="260" viewBox="0 0 1664 260" xmlns="http://www.w3.org/2000/svg">
  <!-- lanes -->
  <path id="laneF" d="M240 92 H1310" stroke="#14213D" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
  <path id="laneB" d="M1310 186 H240" stroke="#A8530A" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
  <text x="820" y="60" text-anchor="middle" class="sub" id="lblF">요청 →</text>
  <text x="820" y="226" text-anchor="middle" class="sub" id="lblB">← 응답</text>

  <!-- node 1: phone -->
  <g id="n1">
    <rect x="40" y="12" width="200" height="222" rx="26" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <rect x="110" y="22" width="60" height="6" rx="3" fill="#14213D"/>
    <text x="56" y="62" class="sub" font-size="14" fill="#14213D" font-weight="700">1. 온실가스가 아닌 것은?</text>
    <g id="opts"></g>
    <rect id="btn" x="58" y="168" width="164" height="34" rx="10" fill="#14213D"/>
    <text id="btnT" x="140" y="191" text-anchor="middle" font-family="NK" font-weight="700" font-size="16" fill="#FFFFFF">제출</text>
    <g id="hintBox" opacity="0">
      <rect x="52" y="110" width="176" height="100" rx="12" fill="#FBEEDD" stroke="#A8530A" stroke-width="3"/>
      <text x="64" y="146" font-family="NK" font-weight="700" font-size="16" fill="#A8530A">✗ 오답 · 힌트</text>
      <text x="64" y="170" class="sub" font-size="14" fill="#14213D">광합성에서 나오는</text>
      <text x="64" y="192" class="sub" font-size="14" fill="#14213D">기체를 떠올려 보세요</text>
    </g>
    <text x="140" y="254" text-anchor="middle" class="sub" font-size="15">프론트엔드 · 학생 화면</text>
  </g>

  <!-- node 2: API -->
  <g id="n2">
    <rect x="420" y="40" width="330" height="180" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <text x="595" y="76" text-anchor="middle" class="lbl">API · 주문서</text>
    <text x="595" y="102" text-anchor="middle" class="sub">POST /api/submit</text>
    <rect id="reqChip" x="436" y="118" width="298" height="40" rx="8" fill="#14213D" opacity="0"/>
    <text id="reqT" x="595" y="144" text-anchor="middle" class="monoW" opacity="0">{"question":1,"answer":"3"}</text>
    <rect id="resChip" x="436" y="166" width="298" height="40" rx="8" fill="#A8530A" opacity="0"/>
    <text id="resT" x="595" y="192" text-anchor="middle" class="monoW" opacity="0">{"correct":false,"hint":"광합성…"}</text>
  </g>

  <!-- node 3: backend -->
  <g id="n3">
    <rect x="890" y="40" width="250" height="180" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <text x="1015" y="76" text-anchor="middle" class="lbl">백엔드 · 채점</text>
    <text x="1015" y="102" text-anchor="middle" class="sub">정답은 서버에만</text>
    <text id="cmp" x="1015" y="146" text-anchor="middle" class="mono" opacity="0">■■■ === "3"</text>
    <text id="verdict" x="1015" y="186" text-anchor="middle" font-family="NK" font-weight="900" font-size="24" fill="#A8530A" opacity="0">✗ 오답</text>
  </g>

  <!-- node 4: DB -->
  <g id="n4">
    <rect x="1310" y="40" width="320" height="180" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <text x="1470" y="76" text-anchor="middle" class="lbl">데이터베이스 · 장부</text>
    <g class="mono" font-size="14">
      <rect x="1326" y="92" width="288" height="28" fill="#EFECE3"/>
      <text x="1336" y="112" class="mono" font-size="14">문항  답  맞음   시각</text>
      <text x="1336" y="142" class="mono" font-size="14" fill="#4A5568">1     2   true   09:11</text>
      <text x="1336" y="170" class="mono" font-size="14" fill="#4A5568">2     3   true   09:11</text>
      <rect id="newRow" x="1326" y="180" width="288" height="28" fill="#F2A541" opacity="0"/>
      <text id="newRowT" x="1336" y="200" class="mono" font-size="14" opacity="0">1     3   false  09:12</text>
    </g>
  </g>

  <!-- traveling dot -->
  <circle id="dot" r="12" fill="#F2A541" stroke="#14213D" stroke-width="3" cx="-50" cy="-50"/>
</svg>
</div>
<script>
const $ = (id) => document.getElementById(id);
const opts = $("opts");
const labels = ["① 이산화탄소", "② 산소", "③ 메탄", "④ 아산화질소"];
const optEls = labels.map((l, i) => {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const y = 80 + i * 22;
  g.innerHTML = `<circle cx="66" cy="${y}" r="6" fill="#fff" stroke="#14213D" stroke-width="2"/><circle cx="66" cy="${y}" r="3" fill="#14213D" opacity="0"/><text x="80" y="${y + 5}" font-family="NK" font-size="14" fill="#14213D">${l}</text>`;
  opts.appendChild(g); return g;
});
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const set = (id, attr, v) => $(id).setAttribute(attr, v);
const nodes = { n1: [40, 20, 200, 220], n2: [470, 40, 250, 180], n3: [890, 40, 250, 180], n4: [1310, 40, 320, 180] };
function glow(id, on) { $(id).querySelector("rect").setAttribute("stroke", on ? "#F2A541" : "#14213D"); $(id).querySelector("rect").setAttribute("stroke-width", on ? "6" : "3"); }

window.render = function (t) {
  // 0–1.5 choose ② and press
  optEls[2].children[1].setAttribute("opacity", t > 0.6 ? 1 : 0);
  const pressed = t > 1.1 && t < 1.5;
  set("btn", "fill", pressed ? "#A8530A" : "#14213D");
  set("btnT", "opacity", 1);
  // dot path
  let x = -50, y = -50;
  const f1 = [240, 420], f2 = [750, 890], f3 = [1140, 1310];
  if (t >= 1.5 && t < 3.2) { x = f1[0] + (f1[1] - f1[0]) * ease(seg(t, 1.5, 3.2)); y = 92; }
  else if (t >= 3.2 && t < 4.2) { x = 595; y = 92; }
  else if (t >= 4.2 && t < 5.6) { x = f2[0] + (f2[1] - f2[0]) * ease(seg(t, 4.2, 5.6)); y = 92; }
  else if (t >= 7.2 && t < 8.6) { x = f3[0] + (f3[1] - f3[0]) * ease(seg(t, 7.2, 8.6)); y = 92; }
  else if (t >= 9.6 && t < 12) { x = 1310 - (1310 - 240) * ease(seg(t, 9.6, 12)); y = 186; }
  set("dot", "cx", x); set("dot", "cy", y);
  set("dot", "fill", t >= 9.6 ? "#A8530A" : "#F2A541");
  // request chip
  const reqOn = t >= 3.0 ? 1 : 0; set("reqChip", "opacity", reqOn); set("reqT", "opacity", reqOn);
  // grading
  set("cmp", "opacity", seg(t, 5.6, 6.0));
  set("verdict", "opacity", seg(t, 6.4, 6.8));
  // db row
  const rowOn = seg(t, 8.6, 9.0); set("newRow", "opacity", rowOn); set("newRowT", "opacity", rowOn);
  // response chip (passes through API on the way back)
  const resOn = t >= 10.6 ? 1 : 0; set("resChip", "opacity", resOn); set("resT", "opacity", resOn);
  // hint on phone
  const hint = seg(t, 12.0, 12.5);
  set("hintBox", "opacity", hint);
  set("btn", "opacity", 1 - hint); set("btnT", "opacity", 1 - hint);
  // highlights
  glow("n1", (t < 1.5) || t >= 12);
  glow("n2", (t >= 3.0 && t < 4.4) || (t >= 10.4 && t < 11.2));
  glow("n3", t >= 5.6 && t < 7.4);
  glow("n4", t >= 8.6 && t < 9.8);
  set("lblF", "opacity", t < 9.6 ? 1 : 0.35);
  set("lblB", "opacity", t >= 9.6 ? 1 : 0.35);
};
window.render(0);
</script></body></html>
