<h2>“평가 문제 만들어줘”와 비교해 보기</h2>
<p class="code"><span class="c">역할</span>  너는 고등학교 [과목] 교사야.<br><span class="c">대상</span>  고[학년] 학생, 학습 수준은 중간이야.<br><span class="c">과제</span>  [단원명] 형성평가 문항 5개를 만들어 줘.<br><span class="c">조건</span>  객관식 3개, 서술형 2개. 각 문항에 성취기준 표시.<br><span class="c">형식</span>  표로: 번호 | 문항 | 정답 | 해설 | 성취기준</p>
<p class="note">확인: 정답·성취기준이 실제와 맞는지 교사가 검토 → 환각 체험</p>
<aside>먼저 한 줄 프롬프트로 결과를 본 뒤 5요소 버전과 비교.</aside>
